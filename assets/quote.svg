<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 78" width="100%" height="78" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="quote-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#081028"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="quote-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#1e3a8a" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#1e3a8a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Shimmer Top Beam -->
    <linearGradient id="quote-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0">
        <animate attributeName="x1" values="-100%;200%" dur="3.5s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0%;300%" dur="3.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9">
        <animate attributeName="x1" values="-100%;200%" dur="3.5s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0%;300%" dur="3.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0">
        <animate attributeName="x1" values="-100%;200%" dur="3.5s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0%;300%" dur="3.5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="quote-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.35"/>
      <circle cx="0" cy="0" r="0.6" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>

    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace;
      }
      .quote-body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 500;
        font-style: italic;
        fill: #f1f5f9;
        letter-spacing: 0.4px;
      }
      .quote-author {
        font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        fill: #38bdf8;
        letter-spacing: 1px;
      }
      .telemetry {
        font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 8px;
        font-weight: 600;
        letter-spacing: 0.6px;
      }
    </style>
  </defs>

  <!-- ==================== CONTAINER BOX ==================== -->
  <path d="M 14 2 L 836 2 L 848 14 L 848 64 L 836 76 L 14 76 L 2 64 L 2 14 Z" fill="url(#quote-bg)" stroke="url(#quote-border)" stroke-width="1.3"/>

  <!-- Background Blueprint Dot-Grid -->
  <rect x="6" y="6" width="838" height="66" fill="url(#quote-grid)" opacity="0.65"/>

  <!-- Shimmer Top Beam -->
  <line x1="14" y1="2" x2="836" y2="2" stroke="url(#quote-shimmer)" stroke-width="1.8"/>

  <!-- ==================== TOP TELEMETRY BAR ==================== -->
  <g transform="translate(24, 14)">
    <text x="0" y="0" class="telemetry" fill="#38bdf8">[SYS.LOG // ARCHITECTURAL_PHILOSOPHY.LOG]</text>
    <circle cx="215" cy="-3" r="3" fill="#f43f5e">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="224" y="0" class="telemetry" fill="#f43f5e">LIVE_STREAM</text>

    <!-- Center Line -->
    <line x1="300" y1="-3" x2="560" y2="-3" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="3 3"/>

    <text x="580" y="0" class="telemetry" fill="#64748b">DIJKSTRA_V1.0</text>
    <text x="690" y="0" class="telemetry" fill="#64748b">CHECKSUM: 0x8F3D</text>
    <text x="795" y="0" class="telemetry" fill="#475569">[0x09]</text>
  </g>

  <!-- ==================== LEFT DECORATIVE AUDIO WAVE ==================== -->
  <g transform="translate(36, 48)">
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="y1" values="-4;-10;-3;-8;-4" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="4;10;3;8;4" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="6" y1="-10" x2="6" y2="10" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="y1" values="-8;-14;-6;-12;-8" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="8;14;6;12;8" dur="1.5s" repeatCount="indefinite"/>
    </line>
    <line x1="12" y1="-4" x2="12" y2="4" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="y1" values="-3;-8;-2;-7;-3" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="3;8;2;7;3" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="18" y1="-12" x2="18" y2="12" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="y1" values="-10;-16;-8;-14;-10" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="10;16;8;14;10" dur="1.7s" repeatCount="indefinite"/>
    </line>
    <line x1="24" y1="-6" x2="24" y2="6" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="y1" values="-5;-9;-4;-8;-5" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="5;9;4;8;5" dur="1.3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ==================== CENTER QUOTE & ATTRIBUTION ==================== -->
  <g transform="translate(425, 43)" text-anchor="middle">
    <!-- Glowing Quotation Marks -->
    <text x="-215" y="-1" font-family="Georgia, serif" font-size="28px" fill="#38bdf8" opacity="0.6">“</text>
    <text x="0" y="0" class="quote-body">
      Simplicity is prerequisite for reliability.
    </text>
    <text x="180" y="7" font-family="Georgia, serif" font-size="28px" fill="#38bdf8" opacity="0.6">”</text>

    <!-- Author Tag -->
    <text x="0" y="19" class="quote-author">— EDSGER W. DIJKSTRA // COMPUTER SCIENTIST</text>
  </g>

  <!-- ==================== RIGHT DECORATIVE RETICLE ==================== -->
  <g transform="translate(795, 48)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="4" fill="#071026" stroke="#38bdf8" stroke-width="1"/>
    <line x1="-14" y1="0" x2="-8" y2="0" stroke="#38bdf8" stroke-width="1"/>
    <line x1="8" y1="0" x2="14" y2="0" stroke="#38bdf8" stroke-width="1"/>
    <line x1="0" y1="-14" x2="0" y2="-8" stroke="#38bdf8" stroke-width="1"/>
    <line x1="0" y1="8" x2="0" y2="14" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.6" fill="none">
    <path d="M 836 56 L 836 66 L 826 66" />
    <path d="M 14 56 L 14 66 L 24 66" />
  </g>
</svg>