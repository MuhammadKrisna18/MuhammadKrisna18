<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 64" width="100%" height="64" fill="none">
  <defs>
    <!-- Card Border -->
    <linearGradient id="quote-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Top Spotlight -->
    <radialGradient id="quote-spotlight" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Geist", Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect x="1" y="1" width="848" height="62" rx="12" fill="#09090b" stroke="url(#quote-border)" stroke-width="1"/>
  <rect x="1" y="1" width="848" height="62" rx="12" fill="url(#quote-spotlight)"/>

  <!-- Editorial Centered Quote -->
  <g transform="translate(425, 30)" text-anchor="middle">
    <text x="0" y="0" class="sans" font-size="13.5px" font-weight="400" fill="#d4d4d8" letter-spacing="-0.1px">
      “Simplicity is prerequisite for reliability.”
    </text>
    <text x="0" y="18" class="mono" font-size="10px" font-weight="500" fill="#71717a" letter-spacing="0.6px">
      — EDSGER W. DIJKSTRA
    </text>
  </g>
</svg>