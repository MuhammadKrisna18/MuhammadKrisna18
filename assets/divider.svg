<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 16" width="100%" height="16" fill="none">
  <defs>
    <!-- Hairline Gradient -->
    <linearGradient id="hairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Hairline Separator -->
  <line x1="80" y1="8" x2="770" y2="8" stroke="url(#hairline)" stroke-width="1"/>

  <!-- Minimal Center Refined Micro-Accent -->
  <circle cx="425" cy="8" r="1.5" fill="#52525b" opacity="0.6"/>
</svg>