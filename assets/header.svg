<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="180" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#1e293b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Shimmer Highlight Gradient -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0">
        <animate attributeName="x1" values="-100%;200%" dur="3.5s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0%;300%" dur="3.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85">
        <animate attributeName="x1" values="-100%;200%" dur="3.5s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0%;300%" dur="3.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0">
        <animate attributeName="x1" values="-100%;200%" dur="3.5s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0%;300%" dur="3.5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Ambient Glow Circles -->
    <radialGradient id="ambient-cyan" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambient-blue" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>

    <style>
      .mono-tag {
        font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 13px;
        font-weight: 500;
        fill: #38bdf8;
        letter-spacing: 1px;
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 38px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 17px;
        font-weight: 500;
        fill: #93c5fd;
      }

      /* Animations */
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes statusPulse {
        0% { r: 4px; opacity: 1; }
        50% { r: 7.5px; opacity: 0.25; }
        100% { r: 4px; opacity: 1; }
      }

      .cursor {
        animation: blinkCursor 1s infinite;
      }
      .status-ping {
        animation: statusPulse 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="176" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Ambient Light Fields -->
  <circle cx="720" cy="50" r="160" fill="url(#ambient-cyan)"/>
  <circle cx="140" cy="140" r="140" fill="url(#ambient-blue)"/>

  <!-- Subtle Blueprint Tech Grid Background -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="0.75">
    <line x1="50" y1="0" x2="50" y2="180" />
    <line x1="150" y1="0" x2="150" y2="180" />
    <line x1="250" y1="0" x2="250" y2="180" />
    <line x1="350" y1="0" x2="350" y2="180" />
    <line x1="450" y1="0" x2="450" y2="180" />
    <line x1="550" y1="0" x2="550" y2="180" />
    <line x1="650" y1="0" x2="650" y2="180" />
    <line x1="750" y1="0" x2="750" y2="180" />

    <line x1="0" y1="45" x2="850" y2="45" />
    <line x1="0" y1="90" x2="850" y2="90" />
    <line x1="0" y1="135" x2="850" y2="135" />
  </g>

  <!-- Animated Top Border Shimmer Beam -->
  <rect x="16" y="2" width="818" height="2" fill="url(#shimmer)"/>

  <!-- Window Control Dots (Terminal Mac Aesthetic) -->
  <circle cx="36" cy="26" r="4.5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="50" cy="26" r="4.5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="64" cy="26" r="4.5" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Code / Terminal Tag Pill -->
  <g transform="translate(40, 62)">
    <rect x="0" y="-14" width="185" height="24" rx="5" fill="#0b1329" stroke="#1e3a8a" stroke-width="1" />
    <text x="12" y="2" class="mono-tag">// software_engineer.ts</text>
  </g>

  <!-- Status Card (Positioned Top Right using pure SVG native transform) -->
  <g transform="translate(630, 20)">
    <g>
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; 0,-3; 0,0"
        dur="4s"
        repeatCount="indefinite"
      />
      <rect x="0" y="0" width="180" height="42" rx="8" fill="#0b1329" stroke="#1e3a8a" stroke-width="1"/>
      <!-- Pulsing Dot -->
      <circle cx="20" cy="21" r="5" fill="#38bdf8" opacity="0.3" class="status-ping"/>
      <circle cx="20" cy="21" r="3.5" fill="#38bdf8"/>
      <!-- Status Text -->
      <text x="34" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11px" font-weight="600" fill="#f8fafc">Status</text>
      <text x="34" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5px" font-weight="400" fill="#93c5fd">Open to Collaborate</text>
    </g>
  </g>

  <!-- Main Name Header -->
  <g transform="translate(40, 114)">
    <text x="0" y="0" class="title">Muhammad Krisna<tspan fill="#38bdf8">.</tspan></text>
  </g>

  <!-- Subtitle: Software Engineer only -->
  <g transform="translate(40, 146)">
    <text x="0" y="0" class="subtitle">Software Engineer <tspan class="cursor" fill="#38bdf8">_</tspan></text>
  </g>

  <!-- Decorative Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.35" fill="none">
    <path d="M 820 135 L 826 135 L 826 145" />
    <path d="M 826 155 L 826 165 L 816 165" />
  </g>
</svg>
