<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="100%" height="170" fill="none">
  <defs>
    <!-- Linear-style Card Subtle Border Gradient -->
    <linearGradient id="card-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Soft Diffuse Top Spotlight -->
    <radialGradient id="card-spotlight" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Typographic Highlight -->
    <linearGradient id="text-metallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>

    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Geist", Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- ==================== CONTAINER SURFACE ==================== -->
  <rect x="1" y="1" width="848" height="168" rx="14" fill="#09090b" stroke="url(#card-border)" stroke-width="1"/>
  <rect x="1" y="1" width="848" height="168" rx="14" fill="url(#card-spotlight)"/>

  <!-- ==================== TOP CONTEXT ROW ==================== -->
  <!-- Left: Availability Status Pill -->
  <g transform="translate(48, 28)">
    <rect x="0" y="0" width="166" height="24" rx="12" fill="#141416" stroke="#27272a" stroke-width="1"/>
    <!-- Steady Green Status Indicator -->
    <circle cx="12" cy="12" r="3.5" fill="#10b981"/>
    <circle cx="12" cy="12" r="5.5" fill="none" stroke="#10b981" stroke-width="1" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.05;0.3" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="r" values="4.5;7;4.5" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="15.5" class="sans" font-size="11.5px" font-weight="500" fill="#a1a1aa">Open to collaborate</text>
  </g>

  <!-- Right: Clean Minimal Metadata Tag -->
  <g transform="translate(802, 44)">
    <text x="0" y="0" class="mono" font-size="11px" font-weight="500" fill="#52525b" text-anchor="end" letter-spacing="0.5px">ID: MK-18  •  UTC+7</text>
  </g>

  <!-- ==================== MAIN TYPOGRAPHY & HERO ==================== -->
  <!-- Primary Name Display -->
  <g transform="translate(48, 98)">
    <text x="0" y="0" class="sans" font-size="42px" font-weight="700" fill="url(#text-metallic)" letter-spacing="-1.2px">Muhammad Krisna<tspan fill="#52525b" font-weight="400">.</tspan></text>
  </g>

  <!-- Role & Focus Area (High-contrast, clean hierarchy) -->
  <g transform="translate(48, 130)">
    <text x="0" y="0" class="sans" font-size="15px" letter-spacing="-0.2px">
      <tspan fill="#f4f4f5" font-weight="500">Software Engineer</tspan>
      <tspan fill="#3f3f46">  /  </tspan>
      <tspan fill="#71717a" font-weight="400">Systems, Backend &amp; Architecture</tspan>
    </text>
  </g>
</svg>