<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Border Linear Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#1e293b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Shimmer Highlight Gradient -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0">
        <animate attributeName="x1" values="-100%;200%" dur="4s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0%;300%" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.8">
        <animate attributeName="x1" values="-100%;200%" dur="4s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0%;300%" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0">
        <animate attributeName="x1" values="-100%;200%" dur="4s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0%;300%" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Radial Ambient Blur -->
    <radialGradient id="ambient-cyan" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambient-blue" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>

    <style>
      .mono-tag {
        font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 13px;
        font-weight: 500;
        fill: #38bdf8;
        letter-spacing: 1.5px;
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 40px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 17px;
        font-weight: 500;
        fill: #93c5fd;
      }
      .desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 400;
        fill: #94a3b8;
      }
      .status-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #cbd5e1;
      }

      /* Animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes floatDot {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes statusPulse {
        0% { r: 4px; opacity: 1; }
        50% { r: 7px; opacity: 0.3; }
        100% { r: 4px; opacity: 1; }
      }

      .pulse-bg {
        transform-origin: center;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .cursor {
        animation: blinkCursor 1s infinite;
      }
      .status-ping {
        animation: statusPulse 2s ease-in-out infinite;
      }
      .floating {
        animation: floatDot 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="256" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Ambient Light Fields -->
  <circle cx="700" cy="50" r="180" fill="url(#ambient-cyan)" class="pulse-bg"/>
  <circle cx="150" cy="200" r="160" fill="url(#ambient-blue)" class="pulse-bg"/>

  <!-- Subtle Blueprint Tech Grid Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="0.75">
    <line x1="50" y1="0" x2="50" y2="260" />
    <line x1="150" y1="0" x2="150" y2="260" />
    <line x1="250" y1="0" x2="250" y2="260" />
    <line x1="350" y1="0" x2="350" y2="260" />
    <line x1="450" y1="0" x2="450" y2="260" />
    <line x1="550" y1="0" x2="550" y2="260" />
    <line x1="650" y1="0" x2="650" y2="260" />
    <line x1="750" y1="0" x2="750" y2="260" />

    <line x1="0" y1="50" x2="850" y2="50" />
    <line x1="0" y1="100" x2="850" y2="100" />
    <line x1="0" y1="150" x2="850" y2="150" />
    <line x1="0" y1="200" x2="850" y2="200" />
  </g>

  <!-- Animated Top Border Shimmer Beam -->
  <rect x="18" y="2" width="814" height="2" fill="url(#shimmer)"/>

  <!-- Window Control Dots (Mac/Terminal Aesthetic) -->
  <circle cx="36" cy="32" r="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="52" cy="32" r="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="68" cy="32" r="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Code/Terminal Prompt Tag -->
  <g transform="translate(42, 75)">
    <rect x="-8" y="-15" width="180" height="26" rx="6" fill="#0f172a" stroke="#1e3a8a" stroke-width="1" />
    <text x="4" y="2" class="mono-tag">// software_engineer.ts</text>
  </g>

  <!-- Main Name Header -->
  <g transform="translate(42, 130)">
    <text x="0" y="0" class="title">Muhammad Krisna</text>
    <!-- Cyan glow accent on the dot or symbol -->
    <text x="400" y="0" class="title" fill="#38bdf8">.</text>
  </g>

  <!-- Subtitle / Role -->
  <g transform="translate(42, 165)">
    <text x="0" y="0" class="subtitle">Software Engineer</text>
    <text x="160" y="-1" class="subtitle" fill="#38bdf8">·</text>
    <text x="178" y="0" class="subtitle" fill="#cbd5e1" font-weight="400">Full-Stack &amp; Scalable Systems</text>
    <text x="430" y="0" class="mono-tag cursor" fill="#38bdf8" font-size="18px">_</text>
  </g>

  <!-- Short Philosophy Tagline -->
  <text x="42" y="200" class="desc">
    Architecting clean web platforms, robust backends, and responsive user experiences.
  </text>

  <!-- Right Decorative Tech Badge / Status Card -->
  <g transform="translate(620, 160)" class="floating">
    <!-- Status Card Box -->
    <rect x="0" y="0" width="185" height="58" rx="10" fill="#0b1329" stroke="#1e3a8a" stroke-width="1"/>
    
    <!-- Pulsing Status Light -->
    <circle cx="22" cy="23" r="5" fill="#38bdf8" opacity="0.3" class="status-ping"/>
    <circle cx="22" cy="23" r="4" fill="#38bdf8"/>

    <!-- Status Text -->
    <text x="36" y="26" class="status-text" font-weight="600" fill="#f8fafc">Status</text>
    <text x="36" y="44" class="status-text" font-size="11px" fill="#93c5fd">Open to Collaborate</text>
  </g>

  <!-- Decorative Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M 816 48 L 826 48 L 826 58" />
    <path d="M 826 210 L 826 220 L 816 220" />
  </g>
</svg>
