<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 100" width="100%" height="100" fill="none">
  <defs>
    <!-- Card Border -->
    <linearGradient id="pipe-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Top Spotlight -->
    <radialGradient id="pipe-spotlight" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Geist", Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
      }
      .stage-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11.5px;
        font-weight: 500;
        fill: #f4f4f5;
        letter-spacing: -0.1px;
      }
      .stage-sub {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 9px;
        font-weight: 400;
        fill: #71717a;
      }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect x="1" y="1" width="848" height="98" rx="14" fill="#09090b" stroke="url(#pipe-border)" stroke-width="1"/>
  <rect x="1" y="1" width="848" height="98" rx="14" fill="url(#pipe-spotlight)"/>

  <!-- Connecting Bus Track -->
  <line x1="95" y1="44" x2="755" y2="44" stroke="#27272a" stroke-width="1"/>

  <!-- Subtle Traveling Light Pulse -->
  <circle r="2.5" fill="#ffffff">
    <animate attributeName="cx" values="95; 755" dur="3s" repeatCount="indefinite" />
    <animate attributeName="cy" values="44; 44" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2; 0.9; 0.2" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- ==================== STAGE 1: CODE ==================== -->
  <g transform="translate(95, 44)">
    <circle cx="0" cy="0" r="15" fill="#141416" stroke="#27272a" stroke-width="1"/>
    <!-- Code Icon -->
    <text x="0" y="3.5" class="mono" font-size="9.5px" font-weight="600" fill="#e4e4e7" text-anchor="middle">&lt;/&gt;</text>
    <text x="0" y="27" class="stage-title" text-anchor="middle">Code</text>
    <text x="0" y="38" class="stage-sub" text-anchor="middle">local workspace</text>
  </g>

  <!-- ==================== STAGE 2: COMMIT ==================== -->
  <g transform="translate(315, 44)">
    <circle cx="0" cy="0" r="15" fill="#141416" stroke="#27272a" stroke-width="1"/>
    <!-- Git Commit Icon -->
    <circle cx="0" cy="0" r="4" fill="none" stroke="#e4e4e7" stroke-width="1.5"/>
    <line x1="-8" y1="0" x2="-4" y2="0" stroke="#e4e4e7" stroke-width="1.5"/>
    <line x1="4" y1="0" x2="8" y2="0" stroke="#e4e4e7" stroke-width="1.5"/>
    <text x="0" y="27" class="stage-title" text-anchor="middle">Commit</text>
    <text x="0" y="38" class="stage-sub" text-anchor="middle">version control</text>
  </g>

  <!-- ==================== STAGE 3: TEST & BUILD ==================== -->
  <g transform="translate(535, 44)">
    <circle cx="0" cy="0" r="15" fill="#141416" stroke="#27272a" stroke-width="1"/>
    <!-- Checkmark Icon -->
    <path d="M -4 -0.5 L -1 2.5 L 4 -2.5" fill="none" stroke="#e4e4e7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="27" class="stage-title" text-anchor="middle">Verify</text>
    <text x="0" y="38" class="stage-sub" text-anchor="middle">automated ci</text>
  </g>

  <!-- ==================== STAGE 4: GITHUB DEPLOY ==================== -->
  <g transform="translate(755, 44)">
    <circle cx="0" cy="0" r="15" fill="#141416" stroke="#27272a" stroke-width="1"/>
    <!-- Minimal Octocat Glyph -->
    <path transform="translate(-6.5, -6.5) scale(0.81)" fill="#ffffff" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
    <text x="0" y="27" class="stage-title" text-anchor="middle">Deploy</text>
    <text x="0" y="38" class="stage-sub" text-anchor="middle">production main</text>
  </g>
</svg>