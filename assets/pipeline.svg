<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 135" width="100%" height="135" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pipe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#081028"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="pipe-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#1e3a8a" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#2563eb" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Shimmer Top Beam -->
    <linearGradient id="pipe-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0">
        <animate attributeName="x1" values="-100%;200%" dur="3s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0%;300%" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9">
        <animate attributeName="x1" values="-100%;200%" dur="3s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0%;300%" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0">
        <animate attributeName="x1" values="-100%;200%" dur="3s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0%;300%" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Laser Stream Gradients -->
    <linearGradient id="laser-stream-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="laser-stream-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="80%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <!-- Pod Card Gradient -->
    <linearGradient id="pod-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1739"/>
      <stop offset="100%" stop-color="#050a18"/>
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="pipe-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.35"/>
      <circle cx="0" cy="0" r="0.6" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace;
      }
      .node-title {
        font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
      }
      .node-sub {
        font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 9px;
        font-weight: 500;
        fill: #64748b;
        letter-spacing: 0.5px;
      }
      .telemetry {
        font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 8.5px;
        font-weight: 600;
        letter-spacing: 0.6px;
      }
    </style>
  </defs>

  <!-- ==================== CONTAINER BOX ==================== -->
  <!-- Chamfered Outer Chassis -->
  <path d="M 14 2 L 836 2 L 848 14 L 848 121 L 836 133 L 14 133 L 2 121 L 2 14 Z" fill="url(#pipe-bg)" stroke="url(#pipe-border)" stroke-width="1.5"/>

  <!-- Background Blueprint Dot-Grid -->
  <rect x="6" y="6" width="838" height="123" fill="url(#pipe-grid)" opacity="0.7"/>

  <!-- Shimmer Top Beam -->
  <line x1="14" y1="2" x2="836" y2="2" stroke="url(#pipe-shimmer)" stroke-width="2"/>

  <!-- ==================== TOP TELEMETRY STRIP ==================== -->
  <g transform="translate(24, 16)">
    <!-- Terminal indicator -->
    <circle cx="0" cy="0" r="3" fill="#10b981"/>
    <text x="8" y="3" class="telemetry" fill="#38bdf8">PIPELINE_ORCHESTRATOR // GIT_OPS_ENGINE_V2</text>
    <line x1="260" y1="0" x2="480" y2="0" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="500" y="3" class="telemetry" fill="#93c5fd">DAEMON: ACTIVE</text>
    <text x="610" y="3" class="telemetry" fill="#64748b">LATENCY: 8ms</text>
    <text x="700" y="3" class="telemetry" fill="#64748b">AUTO_SYNC: TRUE</text>
    <text x="800" y="3" class="telemetry" fill="#475569">[0x7A]</text>
  </g>

  <!-- ==================== CIRCUIT BOARD PCB TRACES ==================== -->
  <g stroke="#1e3a8a" stroke-width="0.8" opacity="0.6" fill="none">
    <!-- Branching lines with 45-degree bends -->
    <path d="M 40 40 L 120 40 L 140 25 L 200 25"/>
    <circle cx="200" cy="25" r="2" fill="#0b1329" stroke="#38bdf8" stroke-width="1"/>
    
    <path d="M 720 115 L 660 115 L 640 125 L 590 125"/>
    <circle cx="590" cy="125" r="2" fill="#0b1329" stroke="#38bdf8" stroke-width="1"/>

    <path d="M 360 115 L 420 115 L 435 125 L 470 125"/>
    <circle cx="470" cy="125" r="2" fill="#0b1329" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- ==================== DUAL FIBER-OPTIC BUS TRACK ==================== -->
  <!-- Base Rails -->
  <line x1="90" y1="67" x2="755" y2="67" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
  <line x1="90" y1="67" x2="755" y2="67" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <line x1="90" y1="67" x2="755" y2="67" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- Upper Secondary Bus Guide -->
  <line x1="90" y1="63" x2="755" y2="63" stroke="#1e3a8a" stroke-width="0.6" stroke-dasharray="8 8" opacity="0.5"/>
  <line x1="90" y1="71" x2="755" y2="71" stroke="#1e3a8a" stroke-width="0.6" stroke-dasharray="8 8" opacity="0.5"/>

  <!-- Continuous Laser Stream (Flowing Left -> Right) -->
  <path d="M 90 67 L 755 67" stroke="url(#laser-stream-cyan)" stroke-width="3" stroke-dasharray="160 500" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="665; 0" dur="2.4s" repeatCount="indefinite" />
  </path>

  <!-- Trailing Secondary Laser Stream (Purple) -->
  <path d="M 90 67 L 755 67" stroke="url(#laser-stream-violet)" stroke-width="2.5" stroke-dasharray="120 540" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" values="665; 0" dur="2.4s" begin="0.8s" repeatCount="indefinite" />
  </path>

  <!-- Traveling High-Energy Photon Packets -->
  <circle r="4" fill="#ffffff">
    <animate attributeName="cx" values="90; 755" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="cy" values="67; 67" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <circle r="8" fill="#38bdf8" opacity="0.6">
    <animate attributeName="cx" values="90; 755" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="cy" values="67; 67" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8; 0.3; 0.8" dur="2.4s" repeatCount="indefinite" />
  </circle>

  <!-- Trailing Second Photon -->
  <circle r="3.5" fill="#a855f7">
    <animate attributeName="cx" values="90; 755" dur="2.4s" begin="0.8s" repeatCount="indefinite" />
    <animate attributeName="cy" values="67; 67" dur="2.4s" begin="0.8s" repeatCount="indefinite" />
  </circle>

  <!-- Animated Data Flow Arrows -->
  <g fill="#38bdf8" opacity="0.4" font-family="monospace" font-size="9px" font-weight="700">
    <text x="180" y="70" text-anchor="middle">&gt;&gt;&gt;</text>
    <text x="400" y="70" text-anchor="middle">&gt;&gt;&gt;</text>
    <text x="630" y="70" text-anchor="middle">&gt;&gt;&gt;</text>
  </g>

  <!-- ==================== NODE 1: LOCAL CODE ==================== -->
  <g transform="translate(90, 67)">
    <!-- Stage Pill Top Badge -->
    <rect x="-24" y="-38" width="48" height="15" rx="3" fill="#071026" stroke="#1e3a8a" stroke-width="1"/>
    <text x="0" y="-27" class="telemetry" fill="#38bdf8" text-anchor="middle">SRC: 01</text>

    <!-- Node Outer Ring -->
    <circle cx="0" cy="0" r="24" fill="url(#pod-card)" stroke="#1e3a8a" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="18" fill="#071026" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- Code Icon < / > -->
    <text x="0" y="5" font-family="monospace" font-size="12px" font-weight="800" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>

    <!-- Status Mini LED -->
    <circle cx="16" cy="-16" r="3" fill="#10b981"/>

    <!-- Labels -->
    <text x="0" y="36" class="node-title" fill="#f8fafc" text-anchor="middle">CODE</text>
    <text x="0" y="48" class="node-sub" text-anchor="middle">local: workspace</text>
  </g>

  <!-- ==================== NODE 2: GIT COMMIT ==================== -->
  <g transform="translate(305, 67)">
    <!-- Stage Pill Top Badge -->
    <rect x="-24" y="-38" width="48" height="15" rx="3" fill="#071026" stroke="#1e3a8a" stroke-width="1"/>
    <text x="0" y="-27" class="telemetry" fill="#93c5fd" text-anchor="middle">VCS: 02</text>

    <!-- Node Ring -->
    <circle cx="0" cy="0" r="20" fill="url(#pod-card)" stroke="#1e3a8a" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="14" fill="#071026" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="5" fill="#38bdf8"/>

    <!-- Status Mini LED -->
    <circle cx="14" cy="-14" r="2.5" fill="#38bdf8"/>

    <!-- Labels -->
    <text x="0" y="34" class="node-title" fill="#93c5fd" text-anchor="middle">COMMIT</text>
    <text x="0" y="46" class="node-sub" text-anchor="middle">sha: #8f2a1b</text>
  </g>

  <!-- ==================== NODE 3: BUILD & TEST ==================== -->
  <g transform="translate(525, 67)">
    <!-- Stage Pill Top Badge -->
    <rect x="-24" y="-38" width="48" height="15" rx="3" fill="#071026" stroke="#1e3a8a" stroke-width="1"/>
    <text x="0" y="-27" class="telemetry" fill="#a5f3fc" text-anchor="middle">TEST: 03</text>

    <!-- Node Ring -->
    <circle cx="0" cy="0" r="20" fill="url(#pod-card)" stroke="#1e3a8a" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="14" fill="#071026" stroke="#38bdf8" stroke-width="1.2"/>
    
    <!-- Checkmark Icon -->
    <path d="M -4 0 L -1 3 L 5 -3" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Status Mini LED -->
    <circle cx="14" cy="-14" r="2.5" fill="#10b981"/>

    <!-- Labels -->
    <text x="0" y="34" class="node-title" fill="#a5f3fc" text-anchor="middle">BUILD &amp; TEST</text>
    <text x="0" y="46" class="node-sub" text-anchor="middle">coverage: 98%</text>
  </g>

  <!-- ==================== NODE 4: GITHUB DEPLOY ==================== -->
  <g transform="translate(755, 67)">
    <!-- Ripple Waves on Arrival -->
    <circle cx="0" cy="0" r="24" stroke="#38bdf8" stroke-width="1.5" fill="none">
      <animate attributeName="r" values="24; 38" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8; 0" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="24" stroke="#2563eb" stroke-width="1" fill="none">
      <animate attributeName="r" values="16; 32" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7; 0" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
    </circle>

    <!-- Stage Pill Top Badge -->
    <rect x="-24" y="-38" width="48" height="15" rx="3" fill="#071026" stroke="#1e3a8a" stroke-width="1"/>
    <text x="0" y="-27" class="telemetry" fill="#38bdf8" text-anchor="middle">DIST: 04</text>

    <!-- Node Body -->
    <circle cx="0" cy="0" r="24" fill="url(#pod-card)" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="18" fill="#071026" stroke="#38bdf8" stroke-width="1.2"/>

    <!-- Octocat GitHub Icon -->
    <path transform="translate(-8, -8) scale(1)" fill="#ffffff" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>

    <!-- Status Mini LED -->
    <circle cx="16" cy="-16" r="3" fill="#38bdf8"/>

    <!-- Labels -->
    <text x="0" y="36" class="node-title" fill="#38bdf8" text-anchor="middle">GITHUB</text>
    <text x="0" y="48" class="node-sub" text-anchor="middle">origin/main</text>
  </g>

  <!-- Decorative Corner Brackets -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.7" fill="none">
    <path d="M 834 110 L 834 122 L 822 122" />
    <path d="M 16 110 L 16 122 L 28 122" />
  </g>
</svg>